<!doctype html>
<html lang="ko" data-sky="morning">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>구름빵의 자기소개</title>
  <style>
    :root {
      --sky: #c7e6fb;
      --horizon: #f1f9fe;
      --sky-ink: #173755;
      --cloud: #fff;
      --sun: #ffdb83;
    }

    :root[data-sky="sunset"] {
      --sky: #f9bb91;
      --horizon: #ffede3;
      --sky-ink: #562e30;
      --cloud: #ffe2db;
      --sun: #fff0ae;
    }

    :root[data-sky="night"] {
      --sky: #151d3b;
      --horizon: #33476d;
      --sky-ink: #f2f6ff;
      --cloud: #606e99;
      --sun: #f9edbd;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(var(--sky), var(--horizon));
      color: #20334b;
      font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(100% - 2rem, 66rem);
      margin-inline: auto;
      padding-block: clamp(1.5rem, 5vw, 4rem);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      align-items: center;
      gap: 1rem;
      color: var(--sky-ink);
      padding: clamp(1rem, 4vw, 3rem) clamp(0.5rem, 3vw, 2rem) 2.5rem;
    }

    .major, .intro, .card p, footer p {
      margin: 0;
    }

    .major {
      font-weight: bold;
    }

    h1 {
      margin: 0.15em 0 0.25em;
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: 1.05;
      letter-spacing: -0.075em;
    }

    .intro {
      max-width: 29rem;
      font-size: clamp(1rem, 2vw, 1.2rem);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }

    .sky-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem 0.85rem;
      margin-top: 1.3rem;
    }

    button {
      padding: 0.7rem 1rem;
      min-height: 2.75rem;
      border: 1px solid transparent;
      border-radius: 0.65rem;
      background: var(--sky-ink);
      color: var(--horizon);
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      border-color: currentColor;
    }

    button:focus-visible {
      outline: 2px solid var(--sky-ink);
      outline-offset: 4px;
    }

    .sky-scene {
      position: relative;
      min-width: 0;
      height: clamp(10rem, 26vw, 17rem);
    }

    .sun {
      position: absolute;
      top: 5%;
      right: 14%;
      width: 35%;
      max-width: 8.5rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 0 0 0 0.8rem color-mix(in srgb, var(--sun) 24%, transparent);
    }

    .cloud {
      position: absolute;
      left: 6%;
      bottom: 20%;
      width: 74%;
      height: 20%;
      border-radius: 999px;
      background: var(--cloud);
    }

    .cloud::before, .cloud::after {
      position: absolute;
      bottom: 10%;
      border-radius: 50%;
      background: inherit;
      aspect-ratio: 1;
      content: "";
    }

    .cloud::before {
      left: 14%;
      width: 30%;
    }

    .cloud::after {
      left: 35%;
      width: 40%;
    }

    .cloud-small {
      left: 65%;
      bottom: 13%;
      width: 30%;
      height: 9%;
      opacity: 0.72;
    }

    .favorites {
      padding: clamp(1.1rem, 4vw, 2.3rem);
      border-radius: 1.25rem;
      background: #fff;
    }

    h2 {
      margin: 0 0 0.7rem;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.85rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .card {
      padding: 1rem;
      border-top: 3px solid var(--accent);
      border-radius: 0.6rem;
      background: var(--card);
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    .card:nth-child(1) { --accent: #479893; --card: #eaf6f3; }
    .card:nth-child(2) { --accent: #6c83be; --card: #eef2fc; }
    .card:nth-child(3) { --accent: #ce8d51; --card: #fcf2e5; }

    h3 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
    }

    footer {
      margin-top: 1rem;
      padding: 0.9rem 0.5rem;
      text-align: center;
      color: var(--sky-ink);
      font-weight: bold;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    @media (max-width: 40rem) {
      .hero {
        grid-template-columns: 1fr;
        padding-bottom: 1.1rem;
      }

      .sky-scene {
        width: min(100%, 19rem);
        height: 9rem;
        min-height: 0;
        justify-self: end;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <p class="major">미디어콘텐츠학과 2학년</p>
        <h1>구름빵</h1>
        <p class="intro">안녕하세요! 산책길의 하늘과 갓 구운 토스트를 좋아하는 구름빵이에요.</p>
        <div class="sky-controls">
          <button id="change-sky" type="button">하늘색 바꾸기</button>
          <span id="sky-name" role="status">아침 하늘</span>
        </div>
      </div>
      <div class="sky-scene" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud"></div>
        <div class="cloud cloud-small"></div>
      </div>
    </header>

    <section class="favorites" aria-labelledby="favorites-title">
      <h2 id="favorites-title">좋아하는 것</h2>
      <ul class="cards" role="list">
        <li class="card">
          <h3>음악 들으며 산책하기</h3>
          <p>수업이 끝나면 좋아하는 노래를 들으며 한 바퀴 걸어요.</p>
        </li>
        <li class="card">
          <h3>하늘 사진 찍기</h3>
          <p>해 질 무렵 구름이 분홍빛으로 바뀌는 순간을 좋아해요.</p>
        </li>
        <li class="card">
          <h3>프렌치토스트 만들기</h3>
          <p>주말 아침에 빵 가장자리를 바삭하게 굽는 게 좋아요.</p>
        </li>
      </ul>
    </section>

    <footer>
      <p>학교 근처에 맛있는 빵집을 아시면 알려 주세요!</p>
    </footer>
  </main>

  <script>
    const skies = [
      { theme: "morning", name: "아침 하늘" },
      { theme: "sunset", name: "노을 하늘" },
      { theme: "night", name: "밤하늘" },
    ];
    const skyButton = document.querySelector("#change-sky");
    const skyName = document.querySelector("#sky-name");
    let skyIndex = 0;

    // 아침, 노을, 밤하늘 순서로 바꾸고 마지막에는 처음으로 돌아갑니다.
    skyButton.addEventListener("click", () => {
      skyIndex = (skyIndex + 1) % skies.length;
      const sky = skies[skyIndex];
      document.documentElement.dataset.sky = sky.theme;
      skyName.textContent = sky.name;
    });
  </script>
</body>
</html>
